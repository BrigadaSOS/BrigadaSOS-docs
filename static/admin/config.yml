# Decap CMS Configuration for Brigada SOS
# Documentation: https://decapcms.org/docs/configuration-options/

backend:
  name: github
  repo: BrigadaSOS/brigadasos.xyz
  branch: main
  base_url: https://brigadasos.xyz
  auth_endpoint: /api/auth

locale: 'es'

media_folder: 'static/img'
public_folder: '/img'

publish_mode: editorial_workflow

collections:
  - name: 'intro'
    label: 'Página de Inicio'
    files:
      - label: 'Inicio'
        name: 'homepage'
        file: 'docs/intro.mdx'
        fields:
          - { label: 'Título', name: 'title', widget: 'string' }
          - { label: 'Slug', name: 'slug', widget: 'string', default: '/' }
          - { label: 'Posición en Sidebar', name: 'sidebar_position', widget: 'number' }
          - { label: 'Contenido', name: 'body', widget: 'markdown' }

  - name: 'guia-principal'
    label: 'Guía Principal'
    folder: 'docs/guia-principal'
    create: true
    slug: '{{slug}}'
    extension: 'mdx'
    format: 'frontmatter'
    editor:
      preview: true
    fields:
      - { label: 'Título', name: 'title', widget: 'string' }
      - { label: 'Slug', name: 'slug', widget: 'string', required: false }
      - {
          label: 'Posición en Sidebar',
          name: 'sidebar_position',
          widget: 'number',
          required: false,
        }
      - { label: 'Etiqueta del Sidebar', name: 'sidebar_label', widget: 'string', required: false }
      - { label: 'Contenido', name: 'body', widget: 'markdown' }

  - name: 'configuracion'
    label: 'Configuración'
    folder: 'docs/configuracion'
    create: true
    slug: '{{slug}}'
    extension: 'mdx'
    format: 'frontmatter'
    editor:
      preview: true
    fields:
      - { label: 'Título', name: 'title', widget: 'string' }
      - { label: 'Slug', name: 'slug', widget: 'string', required: false }
      - {
          label: 'Posición en Sidebar',
          name: 'sidebar_position',
          widget: 'number',
          required: false,
        }
      - { label: 'Etiqueta del Sidebar', name: 'sidebar_label', widget: 'string', required: false }
      - { label: 'Contenido', name: 'body', widget: 'markdown' }

  - name: 'otras-guias'
    label: 'Otras Guías'
    folder: 'docs/otras-guias'
    create: true
    slug: '{{slug}}'
    extension: 'mdx'
    format: 'frontmatter'
    editor:
      preview: true
    fields:
      - { label: 'Título', name: 'title', widget: 'string' }
      - { label: 'Slug', name: 'slug', widget: 'string', required: false }
      - {
          label: 'Posición en Sidebar',
          name: 'sidebar_position',
          widget: 'number',
          required: false,
        }
      - { label: 'Etiqueta del Sidebar', name: 'sidebar_label', widget: 'string', required: false }
      - { label: 'Contenido', name: 'body', widget: 'markdown' }

  - name: 'utilidad'
